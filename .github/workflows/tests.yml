name: Testes

run-name: ${{ github.actor }} fez commit no projeto

on: [push, pull_request]

jobs:
  backend-tests:
    name: Backend Pytest & Coverage (>=85%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurando uv e Python 3.15
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalando dependências Python
        run: |
          uv python install 3.15
          uv venv --python 3.15 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Rodando testes e validando cobertura >= 85%
        run: .venv/bin/python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  frontend-tests:
    name: Frontend Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurando o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalando dependências Node
        run: npm ci

      - name: Rodando testes unitários do frontend
        run: npm test

  e2e-browser-tests:
    name: Browser E2E Tests & Video Recording (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurando uv e Python 3.15
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Configurando o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalando dependências Python e Node
        run: |
          uv python install 3.15
          uv venv --python 3.15 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          npm ci

      - name: Instalando navegador Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodando testes E2E no navegador e gravando 5 vídeos
        env:
          PYTHON_BIN: .venv/bin/python
        run: npm run record:e2e

      - name: Publicando vídeos E2E como artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-videos
          path: docs/testing/videos/*.webm
          if-no-files-found: error

      - name: Publicando traces/screenshots em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
