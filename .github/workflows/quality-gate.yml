name: Quality Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  python-quality-gate:
    name: Python Linting & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python 3.15
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv python install 3.15
          uv venv --python 3.15 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Ruff Format Check
        run: .venv/bin/ruff format --check app tests

      - name: Ruff Check
        run: .venv/bin/ruff check app tests

      - name: Pyrefly Check
        run: .venv/bin/pyrefly check

  frontend-quality-gate:
    name: Frontend Linting (Angular & TS 7 Oxlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Oxfmt Format Check
        run: npm run format:check

      - name: TS 7 Oxlint
        run: npm run lint:ts

      - name: Angular ESLint
        run: npm run lint:angular

      - name: TypeScript 7 Typecheck
        run: npm run typecheck

      - name: Angular Production Build
        run: npm run build
